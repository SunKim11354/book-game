<script>const books=[{"title": "Pride and Prejudice", "author": "Jane Austen", "year": 1813, "en": "Mr. Bennet was so odd a mixture of quick parts, sarcastic humour, reserve, and caprice, that the experience of three-and-twenty years had been insufficient to make his wife understand his character. Her mind was less difficult to develop. She was a woman of mean understanding, little information, and uncertain temper. When she was discontented, she fancied herself nervous. The business of her life was to get her daughters married; its solace was visiting and news.", "ko": "베넷 씨는 재빠른 판단력과 신랄한 유머, 과묵함과 변덕이 기묘하게 뒤섞인 사람이어서, 23년을 함께 산 아내조차 그의 성격을 제대로 이해하지 못했다. 반면 베넷 부인의 마음은 훨씬 단순했다. 이해력은 평범하고 아는 것은 많지 않았으며 기분도 일정하지 않았다. 마음에 들지 않는 일이 생기면 자신이 신경쇠약에 걸렸다고 생각했다. 그녀의 인생에서 가장 중요한 일은 딸들을 결혼시키는 것이었고, 방문과 소문 이야기가 그 삶의 위안이었다.", "contextKo": "이 대목은 베넷 부부의 성격과 집안 분위기를 압축해서 보여준다. 특히 다섯 딸의 결혼이 어머니에게 사실상 '인생의 사업'이라는 표현은 당시 여성에게 재산과 사회적 안전망이 얼마나 결혼에 의존했는지를 풍자적으로 드러낸다.", "themeKo": "이 작품은 단순한 연애소설이 아니다. 첫인상과 편견, 계급의식, 경제적 이해관계가 사람을 어떻게 오판하게 만드는지를 엘리자베스와 다아시의 관계를 통해 보여준다.", "classicKo": "제인 오스틴의 힘은 거대한 사건보다 일상의 대화와 결혼시장을 통해 사회 구조를 해부하는 데 있다. 유머를 읽다 보면 독자 자신도 인물들과 함께 판단을 수정하게 된다.", "thinkKo": "좋은 판단력이란 처음부터 틀리지 않는 능력일까, 아니면 자신의 판단이 틀렸음을 알아차리고 수정하는 능력일까?", "contextEn": "This passage compresses the Bennet marriage and household into a few ironic lines. Mrs. Bennet's mission to marry off five daughters also points to how strongly women's economic security depended on marriage.", "themeEn": "The novel is not merely a romance. It examines first impressions, prejudice, class and money through Elizabeth and Darcy's repeated misjudgments.", "classicEn": "Austen turns ordinary conversation and courtship into precise social analysis, while making the reader revise judgments alongside her characters.", "thinkEn": "Is good judgment the ability never to be wrong, or the ability to recognize and correct a mistaken judgment?", "backgroundKo": "19세기 초 영국의 지방 젠트리 사회가 배경이다. 여성의 상속권과 경제적 선택지가 제한되어 결혼은 사랑뿐 아니라 생계와 지위의 문제였다. 오스틴은 자신이 관찰한 사교계와 가족의 일상을 예리한 풍자로 그렸다.", "backgroundEn": "Set in the English landed-gentry world of the early nineteenth century, when inheritance rules and limited economic options made marriage a question of security as well as affection. Austen drew on the social world she knew."}, {"title": "Moby-Dick", "author": "Herman Melville", "year": 1851, "en": "Whenever I find myself growing grim about the mouth; whenever it is a damp, drizzly November in my soul; whenever I find myself involuntarily pausing before coffin warehouses, and bringing up the rear of every funeral I meet; and especially whenever my hypos get such an upper hand of me, that it requires a strong moral principle to prevent me from deliberately stepping into the street, and methodically knocking people's hats off—then, I account it high time to get to sea as soon as I can.", "ko": "내 입가가 자꾸 굳어지고, 영혼 속에 축축하고 이슬비 내리는 11월이 찾아올 때가 있다. 나도 모르게 관을 파는 가게 앞에서 발을 멈추고, 마주치는 장례 행렬마다 뒤를 따라가고 싶어질 때도 있다. 특히 우울한 기분이 너무 강해져 길거리로 뛰어나가 사람들의 모자를 하나씩 쳐버리지 않으려면 상당한 자제력이 필요할 정도가 되면, 나는 가능한 한 빨리 바다로 나가야 할 때가 왔다고 생각한다.", "contextKo": "화자 이슈메일이 왜 바다로 나가는지를 설명하는 초반부다. 바다는 직업이나 모험의 장소이기 전에 우울과 답답함에서 벗어나는 정신적 출구다. 이 유머러스한 고백 덕분에 독자는 이슈메일의 시선을 통해 거대한 포경 세계로 들어간다.", "themeKo": "소설의 중심에는 에이해브의 흰고래에 대한 집착이 있지만, 더 깊게는 인간이 이해할 수 없는 세계에 의미를 강요하려는 욕망을 묻는다. 이슈메일은 불확실성을 관찰하고 받아들이지만 에이해브는 그것을 정복하려 한다.", "classicKo": "모험소설, 철학, 종교적 상징, 자연사와 작업 매뉴얼 같은 서로 다른 형식이 한 작품 안에 공존한다. 그래서 《모비 딕》은 '고래 사냥 이야기'보다 훨씬 넓은 인간과 세계의 관계에 관한 소설이 되었다.", "thinkKo": "내가 통제할 수 없는 대상을 이해하려는 노력은 언제 지혜가 되고, 언제 집착으로 변하는가?", "contextEn": "Ishmael explains why he goes to sea: not simply for employment or adventure, but as an escape from a darkening state of mind.", "themeEn": "Behind Ahab's hunt lies a larger question: what happens when humans insist that an unknowable world must yield a single meaning?", "classicEn": "Adventure, philosophy, religion, natural history and working knowledge coexist, making the novel far more than a whaling story.", "thinkEn": "When does the desire to understand what we cannot control become wisdom—and when does it become obsession?", "backgroundKo": "19세기 중반 미국의 포경산업과 대서양·태평양 항해가 무대다. 멜빌은 실제 선원 경험과 고래잡이 지식을 바탕으로, 팽창하던 미국 사회의 종교·철학적 불안을 바다에 투영했다.", "backgroundEn": "Set amid the nineteenth-century American whaling industry and ocean voyages. Melville drew on his experience at sea and knowledge of whaling to explore the religious and philosophical uncertainties of an expanding nation."}, {"title": "Jane Eyre", "author": "Charlotte Brontë", "year": 1847, "en": "I resisted all the way: a new thing for me, and a circumstance which greatly strengthened the bad opinion Bessie and Miss Abbot were disposed to entertain of me. The fact is, I was a trifle beside myself; or rather out of myself, as the French would say: I was conscious that a moment's mutiny had already rendered me liable to strange penalties, and, like any other rebel slave, I felt resolved, in my desperation, to go all lengths.", "ko": "나는 끌려가는 내내 저항했다. 내게는 처음 있는 일이었고, 그 때문에 베시와 애벗 양이 나를 나쁘게 보던 생각은 더욱 굳어졌다. 사실 나는 잠시 제정신이 아니었다고 해야 할지도 모른다. 단 한 번의 반항만으로도 이상한 벌을 받을 처지가 되었다는 것을 알고 있었고, 절망에 빠진 반역자처럼 이제는 끝까지 가겠다고 마음먹었다.", "contextKo": "어린 제인이 자신을 억압하는 친척 집에서 처음으로 적극적으로 저항하는 장면이다. '반역자'라는 자기 묘사는 어린아이의 사건을 자유와 권력의 문제로 확대한다.", "themeKo": "제인의 핵심 욕구는 단순히 사랑받는 것이 아니라 존엄을 잃지 않고 사랑받는 것이다. 그래서 사랑, 경제적 독립, 종교적 의무 어느 것도 자신의 인격을 포기하는 대가로 받아들이지 않는다.", "classicKo": "19세기 여성 주인공에게 강한 내면의 목소리와 도덕적 자율성을 부여했다는 점에서 중요한 작품이다. 로맨스와 고딕적 긴장 속에 자립이라는 문제가 일관되게 흐른다.", "thinkKo": "사랑이나 소속감을 얻기 위해 자신의 존엄을 얼마나 양보할 수 있는가?", "contextEn": "Young Jane actively resists the relatives who control her. Her language of rebellion enlarges a childhood conflict into a question of freedom and power.", "themeEn": "Jane wants not merely to be loved, but to be loved without surrendering dignity, independence or moral agency.", "classicEn": "Its force comes from giving a nineteenth-century heroine a powerful inner voice and an insistence on autonomy.", "thinkEn": "How much of one's dignity should ever be surrendered in exchange for love or belonging?", "backgroundKo": "빅토리아 시대 영국에서 여성의 경제적 독립과 직업 선택이 제한되던 사회가 배경이다. 브론테는 가정교사로 일한 경험과 기숙학교의 기억을 활용해 계급·성별·종교적 의무의 압력을 그렸다.", "backgroundEn": "Set in Victorian England, when women had restricted economic and professional opportunities. Brontë drew on her experiences of schooling and governess work to examine class, gender and religious duty."}, {"title": "A Tale of Two Cities", "author": "Charles Dickens", "year": 1859, "en": "It was the best of times, it was the worst of times, it was the age of wisdom, it was the age of foolishness, it was the epoch of belief, it was the epoch of incredulity, it was the season of Light, it was the season of Darkness, it was the spring of hope, it was the winter of despair.", "ko": "최고의 시대였고 최악의 시대였다. 지혜의 시대였고 어리석음의 시대였다. 믿음의 시대였고 불신의 시대였다. 빛의 계절이었고 어둠의 계절이었다. 희망의 봄이었고 절망의 겨울이었다.", "contextKo": "소설의 유명한 첫머리는 프랑스혁명 전후의 시대를 모순된 표현으로 묘사한다. 역사는 한 방향으로만 움직이지 않으며 같은 변화가 누군가에게는 희망이고 다른 사람에게는 파국일 수 있음을 예고한다.", "themeKo": "혁명의 폭력과 구체제의 폭정을 모두 바라보면서 개인이 증오의 순환을 끊을 수 있는지를 묻는다. 시드니 카턴의 선택은 자기희생과 '부활'이라는 주제를 완성한다.", "classicKo": "디킨스는 거대한 역사적 격변을 가족과 개인의 운명에 연결해 독자가 혁명을 추상적 사건이 아니라 인간의 선택으로 느끼게 한다.", "thinkKo": "불의한 체제를 무너뜨리는 과정에서 새로운 불의가 생긴다면 혁명은 어디에서 정당성을 잃는가?", "contextEn": "The famous opening describes the revolutionary era through contradictions, warning that the same historical change can mean hope to one person and catastrophe to another.", "themeEn": "The novel condemns both aristocratic oppression and revolutionary vengeance while asking whether an individual can break a cycle of hatred.", "classicEn": "Dickens connects historical upheaval to intimate human choices, making revolution personal rather than abstract.", "thinkEn": "If overthrowing injustice creates a new injustice, at what point does revolution lose its moral legitimacy?", "backgroundKo": "18세기 말 프랑스혁명 전후의 런던과 파리가 무대다. 디킨스는 1859년 영국에서 이 소설을 발표하며 귀족의 폭정과 혁명기의 보복이 모두 인간의 삶을 파괴할 수 있음을 돌아보았다.", "backgroundEn": "Set in London and Paris around the French Revolution of 1789. Writing in 1859, Dickens reflected on both aristocratic oppression and the destructive potential of revolutionary vengeance."}, {"title": "Frankenstein", "author": "Mary Shelley", "year": 1818, "en": "I saw the dull yellow eye of the creature open; it breathed hard, and a convulsive motion agitated its limbs. How can I describe my emotions at this catastrophe, or how delineate the wretch whom with such infinite pains and care I had endeavoured to form? His limbs were in proportion, and I had selected his features as beautiful. Beautiful!—Great God!", "ko": "나는 피조물의 흐릿한 노란 눈이 열리는 것을 보았다. 그것은 거칠게 숨을 쉬었고 팔다리는 경련하듯 움직였다. 이 재앙을 마주한 내 감정을 어떻게 설명할 수 있을까? 그토록 많은 수고와 정성을 들여 만들어낸 존재를 어떻게 묘사할 수 있을까? 팔다리의 비례도 맞았고 얼굴의 각 부분도 아름다운 것을 골랐다. 아름답다고! 맙소사!", "contextKo": "빅터 프랑켄슈타인이 오랫동안 꿈꾸던 생명 창조에 성공하는 순간이다. 그런데 성공의 순간이 곧바로 공포와 거부의 순간으로 뒤집힌다. 중요한 것은 창조 자체보다 창조자가 결과에 책임지지 않고 도망친다는 점이다.", "themeKo": "흔히 '과학이 너무 멀리 갔다'는 이야기로 읽지만, 더 정확히는 능력과 책임의 분리에 관한 소설이다. 피조물의 폭력성도 타고난 악인지 지속적인 거부와 고립의 결과인지 작품은 독자에게 판단을 요구한다.", "classicKo": "1818년에 발표된 작품이 오늘날 AI, 유전공학, 생명공학 논쟁에도 자연스럽게 연결되는 이유는 '할 수 있는가?'보다 '만든 뒤 무엇을 책임져야 하는가?'를 묻기 때문이다.", "thinkKo": "새로운 것을 만들어낼 능력이 있다는 사실만으로 그것을 만들어도 되는가?", "contextEn": "Victor succeeds in creating life, but triumph instantly becomes horror. The decisive failure is not creation alone, but his refusal to care for what he created.", "themeEn": "More than a warning about science, the novel examines the separation of capability from responsibility and asks how rejection shapes the creature.", "classicEn": "Its question remains modern: not only 'Can we create it?' but 'What obligations begin once we do?'", "thinkEn": "Does possessing the ability to create something give us sufficient reason to create it?", "backgroundKo": "19세기 초 유럽에서는 전기와 생명현상에 대한 실험, 산업화, 인간의 창조 능력을 둘러싼 논쟁이 활발했다. 메리 셸리는 1816년 스위스에서의 이야기 창작 모임을 계기로 소설의 구상을 발전시켰다.", "backgroundEn": "Early nineteenth-century Europe was fascinated by electricity, life sciences and the limits of human creation. Mary Shelley developed the novel after a storytelling challenge in Switzerland in 1816."}, {"title": "The Adventures of Huckleberry Finn", "author": "Mark Twain", "year": 1884, "en": "It was a close place. I took it up, and held it in my hand. I was a-trembling, because I'd got to decide, forever, betwixt two things, and I knowed it. I studied a minute, sort of holding my breath, and then says to myself: 'All right, then, I'll go to hell'—and tore it up.", "ko": "정말 막다른 순간이었다. 나는 그것을 집어 손에 들었다. 두 가지 중 하나를 영원히 선택해야 한다는 것을 알고 있었기에 몸이 떨렸다. 숨을 죽인 채 잠시 생각하다가 나는 속으로 말했다. '좋아, 그렇다면 지옥에 가겠어.' 그리고 그것을 찢어버렸다.", "contextKo": "헉은 도망친 노예 짐의 위치를 알리는 편지를 썼다가 찢어버린다. 당시 사회와 종교가 가르친 규범대로라면 짐을 돌려보내는 것이 '옳은 일'이라고 믿고 있었기 때문에, 친구를 돕겠다는 선택을 오히려 죄라고 생각한다.", "themeKo": "이 장면의 역설은 강력하다. 헉의 양심이 사회의 잘못된 도덕교육과 충돌하며, 그는 자신이 지옥에 간다고 믿으면서도 인간적 연대를 선택한다.", "classicKo": "마크 트웨인은 소년의 구어체와 모험담을 이용해 노예제와 인종차별뿐 아니라 '사회가 옳다고 말하는 것이 정말 옳은가'라는 더 넓은 질문을 던진다.", "thinkKo": "개인의 양심과 사회가 가르친 도덕이 충돌할 때 우리는 무엇을 기준으로 판단해야 하는가?", "contextEn": "Huck tears up a letter revealing the location of Jim, an escaped enslaved man. Because society taught him that returning Jim was morally right, helping his friend feels like a sin.", "themeEn": "The scene's power lies in conscience colliding with corrupted moral education: Huck chooses human loyalty even while believing it may damn him.", "classicEn": "Twain uses a boy's vernacular adventure to ask a larger question: is what society calls moral necessarily moral?", "thinkEn": "When personal conscience conflicts with society's moral teaching, what should guide judgment?", "backgroundKo": "미국 남북전쟁 이전의 미시시피강 유역과 노예제 사회가 무대다. 트웨인은 노예제 폐지 이후에 집필하면서도, 인종차별과 위선이 사회의 관습 속에 얼마나 깊이 남아 있는지 풍자했다.", "backgroundEn": "Set along the Mississippi River before the American Civil War, under slavery. Writing after emancipation, Twain examined the enduring power of racism, social hypocrisy and inherited moral assumptions."}, {"title": "Alice's Adventures in Wonderland", "author": "Lewis Carroll", "year": 1865, "en": "The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well. Either the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her and to wonder what was going to happen next.", "ko": "토끼굴은 한동안 터널처럼 곧게 이어지다가 갑자기 아래로 꺾였다. 너무 갑작스러워 앨리스는 멈출 생각조차 하기 전에 아주 깊은 우물 속으로 떨어지고 있었다. 우물이 몹시 깊었던 것인지, 아니면 아주 천천히 떨어졌던 것인지, 앨리스는 내려가는 동안 주위를 둘러보고 다음에는 무슨 일이 일어날지 생각할 시간이 충분했다.", "contextKo": "흰 토끼를 따라간 앨리스가 일상의 세계에서 원더랜드로 넘어가는 장면이다. 현실의 물리법칙이 무너지기 시작하지만 앨리스는 놀라면서도 계속 관찰하고 질문한다.", "themeKo": "원더랜드의 부조리는 단순한 환상이 아니다. 언어, 논리, 교육, 권위가 얼마나 임의적인 규칙 위에 서 있는지를 어린아이의 질문을 통해 뒤집어 본다.", "classicKo": "어린이 모험담이면서 동시에 논리 퍼즐과 언어유희가 가득해 성인 독자도 다른 층위에서 읽을 수 있다는 점이 작품의 독특한 생명력이다.", "thinkKo": "우리가 '상식'이라고 부르는 것 가운데 실제로는 익숙해서 당연하게 느껴질 뿐인 규칙은 얼마나 될까?", "contextEn": "Alice's fall marks the transition from ordinary reality into Wonderland. Physical rules begin to dissolve, yet she continues to observe and question.", "themeEn": "Wonderland's absurdity tests the supposedly natural rules of language, logic, education and authority.", "classicEn": "It works simultaneously as children's adventure, logical puzzle and linguistic comedy, allowing radically different readings at different ages.", "thinkEn": "How many things we call common sense are merely conventions that have become familiar?", "backgroundKo": "빅토리아 시대 영국의 교육과 예절, 논리학에 대한 관심이 배경이다. 수학자였던 루이스 캐럴은 어린 앨리스 리델에게 들려준 이야기를 발전시켜 언어와 상식의 규칙을 뒤집는 판타지를 만들었다.", "backgroundEn": "Rooted in Victorian education, manners and fascination with logic. Lewis Carroll, a mathematician, expanded a story told to Alice Liddell into a fantasy that overturns the rules of language and common sense."}, {"title": "The Picture of Dorian Gray", "author": "Oscar Wilde", "year": 1890, "en": "How sad it is! I shall grow old, and horrible, and dreadful. But this picture will remain always young. It will never be older than this particular day of June.... If it were only the other way! If it were I who was to be always young, and the picture that was to grow old! For that—for that—I would give everything!", "ko": "얼마나 슬픈 일인가! 나는 늙어 추하고 끔찍해질 텐데 이 그림은 언제나 젊은 채로 남겠지. 이 6월의 오늘보다 한 살도 더 먹지 않을 것이다. 반대라면 얼마나 좋을까! 내가 언제나 젊고 초상화가 대신 늙는다면! 그것을 위해서라면 무엇이든 줄 텐데!", "contextKo": "도리언이 자신의 초상화를 보고 젊음이 사라질 운명을 처음 절실하게 의식하는 순간이다. 그의 소망은 이후 현실이 되고, 외모와 내면의 도덕적 상태가 분리되기 시작한다.", "themeKo": "작품은 아름다움과 쾌락 자체를 단순히 비난하지 않는다. 행동의 결과가 외부에 드러나지 않을 때 인간이 어디까지 책임감을 유지할 수 있는지를 실험한다.", "classicKo": "오늘날의 이미지 문화와도 놀랍도록 잘 연결된다. 보이는 자아는 완벽하게 관리하면서 보이지 않는 내면과 행동의 대가는 다른 곳에 축적될 수 있다는 문제다.", "thinkKo": "아무도 나의 잘못을 알 수 없다면, 도덕적 행동을 지탱하는 것은 무엇인가?", "contextEn": "Dorian first feels the terror of aging while his portrait will remain young. His wish later separates outward appearance from inward moral consequence.", "themeEn": "The novel tests what happens to responsibility when the visible self can escape the consequences of conduct.", "classicEn": "Its split between curated appearance and hidden cost feels strikingly relevant to modern image culture.", "thinkEn": "If no one could ever discover our wrongdoing, what would sustain moral behavior?", "backgroundKo": "19세기 말 런던의 상류사회와 예술지상주의 논쟁이 배경이다. 아름다움과 쾌락을 중시하는 미학적 분위기 속에서 와일드는 외면의 완벽함과 도덕적 책임 사이의 긴장을 탐색했다.", "backgroundEn": "Set in fashionable late-Victorian London amid debates over aestheticism and art for art’s sake. Wilde explored the tension between cultivated beauty, pleasure and moral responsibility."}, {"title": "Dracula", "author": "Bram Stoker", "year": 1897, "en": "I did not sleep well, though my bed was comfortable enough, for I had all sorts of queer dreams. There was a dog howling all night under my window, which may have had something to do with it; or it may have been the paprika, for I had to drink up all the water in my carafe, and was still thirsty.", "ko": "침대는 충분히 편안했지만 잠을 잘 자지 못했다. 온갖 이상한 꿈을 꾸었다. 창문 아래에서 개 한 마리가 밤새 울부짖었는데 그것 때문이었을 수도 있다. 아니면 파프리카 때문이었는지도 모른다. 물병의 물을 전부 마시고도 여전히 목이 말랐기 때문이다.", "contextKo": "조너선 하커가 동유럽을 지나 드라큘라의 성으로 향하는 초반 여행 기록이다. 그는 주변의 불길한 징후를 합리적인 이유로 설명하려 하지만 독자는 이미 위험이 다가오고 있음을 느낀다.", "themeKo": "소설은 고대의 공포와 근대 기술을 충돌시킨다. 타자에 대한 공포, 성과 욕망, 질병, 과학과 미신의 긴장이 뱀파이어 이야기 안에 겹쳐 있다.", "classicKo": "일기, 편지, 신문기사, 전보 등 여러 문서를 조립하는 방식은 당시로서는 매우 현대적인 서술기법이었다. 독자는 등장인물들과 함께 흩어진 정보를 연결해 괴물의 실체를 알아낸다.", "thinkKo": "우리는 설명할 수 없는 위험을 만났을 때 기존의 상식에 지나치게 의존하지 않는가?", "contextEn": "Jonathan Harker travels toward Dracula's castle, rationalizing ominous signs that the reader increasingly recognizes as warnings.", "themeEn": "The novel sets ancient terror against modern technology, combining anxieties about outsiders, desire, disease, science and superstition.", "classicEn": "Its collage of diaries, letters, telegrams and reports makes the reader assemble evidence alongside the characters.", "thinkEn": "When facing an unfamiliar danger, can ordinary explanations themselves become a source of blindness?", "backgroundKo": "19세기 말 영국과 트란실바니아가 주요 무대다. 제국의 불안, 새로운 의학과 통신기술, 전통적 미신이 충돌하던 시대에 스토커는 낯선 존재에 대한 공포를 문서 기록 형식으로 구성했다.", "backgroundEn": "Set between late-Victorian Britain and Transylvania, amid anxieties about empire, medicine, communication technology and old superstitions. Stoker presented the terror through assembled documents."}, {"title": "The Time Machine", "author": "H. G. Wells", "year": 1895, "en": "I grieved to think how brief the dream of the human intellect had been. It had committed suicide. It had set itself steadfastly towards comfort and ease, a balanced society with security and permanency as its watchword, it had attained its hopes—to come to this at last. Once, life and property must have reached almost absolute safety.", "ko": "나는 인간 지성의 꿈이 얼마나 짧았는지를 생각하며 슬퍼했다. 그것은 스스로 목숨을 끊은 셈이었다. 인간은 편안함과 안락함을 향해 꾸준히 나아갔고, 안전과 영속성을 구호로 삼는 균형 잡힌 사회를 추구했다. 마침내 그 희망을 이루었지만 결국 여기까지 오고 말았다. 한때 생명과 재산은 거의 완벽하게 안전해졌을 것이다.", "contextKo": "시간 여행자가 먼 미래의 인간 사회를 관찰하며 내리는 섬뜩한 판단이다. 완벽한 안전과 편안함이 반드시 발전의 종착점은 아니며 오히려 인간 능력의 퇴화를 낳을 수 있다고 생각한다.", "themeKo": "웰스는 미래 예언보다 당대 영국의 계급 구조를 미래로 확대한다. 지상과 지하로 갈라진 두 종족은 사회적 분리가 극단까지 진행된 결과처럼 보인다.", "classicKo": "기계로 시간을 여행한다는 아이디어를 대중문화에 강하게 정착시켰을 뿐 아니라 SF가 사회적 사고실험이 될 수 있음을 보여준 작품이다.", "thinkKo": "불편과 위험을 완전히 제거한 사회가 반드시 더 강하고 더 인간적인 사회일까?", "contextEn": "The Traveller concludes that perfect comfort and security may not represent progress; they may instead erode capacities that hardship once demanded.", "themeEn": "Wells projects Victorian class division into the future, turning two human species into a social thought experiment.", "classicEn": "Beyond popularizing mechanical time travel, the novel demonstrated science fiction's power as social criticism.", "thinkEn": "Would a society that eliminated nearly all hardship necessarily become stronger or more fully human?", "backgroundKo": "19세기 말 영국은 산업화와 계급 격차, 진화론의 영향 아래 미래 사회를 상상하고 있었다. 웰스는 그 시대의 사회적 분열을 먼 미래까지 밀어붙여 진보에 대한 낙관을 시험했다.", "backgroundEn": "Late-Victorian Britain was shaped by industrialization, class divisions and evolutionary theory. Wells projected contemporary inequalities into the distant future to challenge easy faith in progress."}, {"title": "The War of the Worlds", "author": "H. G. Wells", "year": 1898, "en": "No one would have believed in the last years of the nineteenth century that this world was being watched keenly and closely by intelligences greater than man's and yet as mortal as his own; that as men busied themselves about their various concerns they were scrutinised and studied, perhaps almost as narrowly as a man with a microscope might scrutinise the transient creatures that swarm and multiply in a drop of water.", "ko": "19세기 말, 인간보다 뛰어나면서도 인간처럼 죽을 수 있는 지성체가 이 세계를 날카롭고 세밀하게 지켜보고 있다고 믿은 사람은 아무도 없었을 것이다. 사람들이 각자의 일상에 몰두하는 동안, 그들은 현미경으로 물 한 방울 속에서 번식하는 미세한 생물을 관찰하듯 인간을 자세히 연구하고 있었을지도 모른다.", "contextKo": "인류가 자신을 세계의 관찰자이자 지배자로 여기던 시선을 단번에 뒤집는 도입부다. 인간이 현미경 아래의 작은 생물처럼 관찰 대상이 될 수 있다는 발상이 이후 침공의 의미를 결정한다.", "themeKo": "화성인의 공격은 단순한 외계인 공포가 아니라 제국주의의 시선을 영국인에게 되돌려준다. 압도적인 기술력을 가진 세력이 약한 사회를 침략한다면 어떤 느낌인지 독자가 경험하게 한다.", "classicKo": "현대 외계인 침공물의 원형이면서 인간 중심주의에 대한 비판이다. 결국 인류를 구하는 것도 최첨단 무기가 아니라 인간이 오랫동안 적응해 온 미생물이라는 점이 중요하다.", "thinkKo": "기술적 우월함을 문명적·도덕적 우월함과 동일시하는 것은 왜 위험한가?", "contextEn": "The opening reverses humanity's usual position as observer and master: humans themselves may be specimens under another intelligence's microscope.", "themeEn": "The invasion turns the logic of imperial conquest back upon Britain, forcing readers to imagine being technologically outmatched.", "classicEn": "It became a model for alien-invasion fiction while also challenging human exceptionalism.", "thinkEn": "Why is it dangerous to confuse technological superiority with moral or civilizational superiority?", "backgroundKo": "대영제국이 강력한 식민제국이던 19세기 말 영국을 배경으로 한다. 웰스는 영국이 오히려 압도적 기술을 가진 침략자의 공격을 받는 상황을 상상해 제국주의와 인간 중심주의를 뒤집었다.", "backgroundEn": "Written when Britain was a major imperial power. Wells imagined Britain itself attacked by a technologically overwhelming invader, reversing the perspective of colonial conquest."}, {"title": "The Call of the Wild", "author": "Jack London", "year": 1903, "en": "He was beaten (he knew that); but he was not broken. He saw, once for all, that he stood no chance against a man with a club. He had learned the lesson, and in all his after life he never forgot it. That club was a revelation. It was his introduction to the reign of primitive law, and he met the introduction halfway.", "ko": "벅은 자신이 얻어맞아 졌다는 것을 알고 있었다. 그러나 굴복한 것은 아니었다. 몽둥이를 든 인간에게는 승산이 없다는 사실을 단번에 깨달았다. 그는 그 교훈을 배웠고 이후 평생 잊지 않았다. 그 몽둥이는 하나의 계시였다. 원초적인 법칙이 지배하는 세계에 처음 들어선 순간이었고, 벅은 그 현실을 받아들이기 시작했다.", "contextKo": "안락한 캘리포니아 생활에서 납치된 벅이 북부의 가혹한 세계에 처음 적응하는 장면이다. 그는 힘의 현실을 이해하지만 정신까지 굴복하지는 않는다.", "themeKo": "문명과 야성은 작품에서 단순한 선악이 아니다. 환경이 바뀌면 생존에 필요한 능력과 규칙도 달라지고, 벅 안에 잠들어 있던 오래된 본능이 깨어난다.", "classicKo": "동물 모험담의 형태를 취하지만 적응, 권력, 생존과 정체성에 관한 이야기다. 인간 사회를 동물의 눈으로 다시 보게 만드는 힘도 있다.", "thinkKo": "환경에 적응한다는 것과 자신의 본질을 잃는다는 것은 어디에서 갈라지는가?", "contextEn": "Removed from comfortable California, Buck learns the brutal rules of the North. He recognizes superior force without becoming inwardly broken.", "themeEn": "Civilization and wildness are not simple good and evil; changing environments awaken different capacities and rules of survival.", "classicEn": "Beneath the animal adventure lies a study of adaptation, power, survival and identity.", "thinkEn": "Where is the boundary between adapting to an environment and losing one's essential self?", "backgroundKo": "19세기 말 클론다이크 골드러시 당시 알래스카와 캐나다 북서부의 혹독한 환경이 배경이다. 잭 런던은 북부에서 경험한 생활과 당시 유행하던 진화·생존 논의를 소설에 반영했다.", "backgroundEn": "Set during the Klondike Gold Rush in the harsh North American northwest. Jack London drew on his northern experiences and contemporary ideas about evolution and survival."}, {"title": "Little Women", "author": "Louisa May Alcott", "year": 1868, "en": "'Christmas won't be Christmas without any presents,' grumbled Jo, lying on the rug. 'It's so dreadful to be poor!' sighed Meg, looking down at her old dress. 'I don't think it's fair for some girls to have plenty of pretty things, and other girls nothing at all,' added little Amy, with an injured sniff. 'We've got Father and Mother, and each other,' said Beth contentedly from her corner.", "ko": "'선물이 하나도 없으면 크리스마스 같지 않을 거야.' 조가 양탄자에 누워 투덜거렸다. '가난하다는 건 정말 끔찍해.' 메그는 낡은 드레스를 내려다보며 한숨을 쉬었다. '어떤 아이들은 예쁜 것을 잔뜩 가지고 다른 아이들은 아무것도 없는 건 불공평해.' 에이미가 억울하다는 듯 말했다. 그러자 구석에 있던 베스가 만족스럽게 말했다. '그래도 우리에겐 아빠와 엄마가 있고, 서로가 있잖아.'", "contextKo": "첫 장면부터 네 자매의 서로 다른 성격이 드러난다. 경제적 어려움과 아버지의 부재 속에서도 가족이 가진 것과 갖지 못한 것을 각자 다른 방식으로 바라본다.", "themeKo": "작품은 '좋은 여성'이 되는 하나의 답을 제시하지 않는다. 네 자매가 예술, 결혼, 가족, 독립과 욕망 사이에서 서로 다른 삶을 선택하는 과정이 핵심이다.", "classicKo": "가정소설의 친숙한 형태 안에서 여성의 야망과 경제적 현실을 진지하게 다뤘다. 특히 조의 작가로서의 욕망은 여러 세대 독자들에게 강한 영향을 주었다.", "thinkKo": "만족은 원하는 것을 덜 가지는 데서 오는가, 아니면 이미 가진 것의 가치를 더 정확히 보는 데서 오는가?", "contextEn": "The opening immediately differentiates the four sisters as they respond to poverty and their father's absence in distinct ways.", "themeEn": "Rather than offering one model of womanhood, the novel follows different negotiations among art, marriage, family, independence and ambition.", "classicEn": "Within a familiar domestic form, Alcott takes female ambition and economic reality seriously, especially through Jo's desire to write.", "thinkEn": "Does contentment come from wanting less, or from seeing more clearly the value of what one already has?", "backgroundKo": "미국 남북전쟁 시기의 뉴잉글랜드 가정이 배경이다. 올컷은 자신의 네 자매와 가족생활에서 영감을 얻어, 전쟁 중 경제적 어려움과 여성의 성장·독립 문제를 다뤘다.", "backgroundEn": "Set in a New England household during the American Civil War. Alcott drew on her family and sisters to portray economic hardship, female ambition and the transition to adulthood."}, {"title": "The Adventures of Sherlock Holmes", "author": "Arthur Conan Doyle", "year": 1892, "en": "To Sherlock Holmes she is always the woman. I have seldom heard him mention her under any other name. In his eyes she eclipses and predominates the whole of her sex. It was not that he felt any emotion akin to love for Irene Adler. All emotions, and that one particularly, were abhorrent to his cold, precise but admirably balanced mind.", "ko": "셜록 홈스에게 그녀는 언제나 '그 여자'다. 그가 그녀를 다른 이름으로 부르는 것을 나는 거의 들어본 적이 없다. 그의 눈에 그녀는 모든 여성을 압도하는 존재였다. 그렇다고 홈스가 아이린 애들러에게 사랑과 비슷한 감정을 품은 것은 아니다. 모든 감정, 특히 사랑은 차갑고 정확하며 훌륭하게 균형 잡힌 그의 정신에는 불편한 것이었다.", "contextKo": "왓슨이 아이린 애들러가 홈스에게 왜 특별한 존재인지 설명하는 유명한 도입부다. 중요한 것은 로맨스보다 홈스가 자신의 지적 우월성을 흔든 상대를 존중한다는 점이다.", "themeKo": "홈스의 추리는 관찰과 논리의 승리처럼 보이지만, 좋은 탐정은 자신의 가설이 틀릴 가능성도 받아들여야 한다. 아이린 애들러는 홈스의 확신에 균열을 낸다.", "classicKo": "홈스는 현대 탐정 캐릭터의 원형을 확립했다. 작은 흔적에서 가설을 세우고 검증하는 과정 자체가 독자의 게임이 된다는 점이 시리즈의 지속적인 매력이다.", "thinkKo": "지능이 높은 사람에게 가장 위험한 약점은 지식의 부족일까, 자신의 판단에 대한 과신일까?", "contextEn": "Watson explains why Irene Adler is exceptional to Holmes: not chiefly as romance, but as someone who disturbed his confidence in intellectual superiority.", "themeEn": "Detection celebrates observation and logic, yet genuine reasoning also requires accepting that one's hypothesis may be wrong.", "classicEn": "Holmes established a durable model of the modern detective and turned inference itself into a game for readers.", "thinkEn": "For an intelligent person, is the greater danger lack of knowledge or excessive confidence in one's own judgment?", "backgroundKo": "19세기 말 런던은 도시화와 과학수사의 발전, 신문 독자층의 확대를 경험하고 있었다. 의사였던 코넌 도일은 세밀한 관찰과 추론을 중심에 둔 탐정을 대중잡지 연재로 널리 알렸다.", "backgroundEn": "Set in rapidly urbanizing late-Victorian London, amid growing interest in science and mass-circulation magazines. Doyle, a physician, popularized a detective defined by observation and inference."}, {"title": "The Hound of the Baskervilles", "author": "Arthur Conan Doyle", "year": 1902, "en": "There is a realm in which the most acute and most experienced of detectives is helpless. The supernatural is beyond his ken, and if the story of the Baskerville curse were true, then the powers of darkness had indeed struck deeply at the family. Yet Holmes listened with the same cool attention which he gave to the most ordinary problem.", "ko": "아무리 예리하고 경험 많은 탐정이라도 무력해지는 영역이 있다. 초자연적인 것은 그의 지식 밖에 있다. 만약 바스커빌 가문의 저주가 사실이라면 어둠의 힘이 그 집안 깊숙이 손을 뻗은 셈이다. 그러나 홈스는 가장 평범한 사건을 들을 때와 똑같이 냉정한 주의력으로 이야기를 들었다.", "contextKo": "황야와 가문의 저주라는 고딕적 분위기 속에서 홈스의 합리적 사고가 시험받는 작품의 핵심 구도를 보여준다. 공포를 무시하는 것이 아니라 공포와 증거를 분리하려 한다.", "themeKo": "사람은 두려울수록 설명을 빨리 확정하고 싶어 한다. 작품은 초자연적 설명의 매력과 증거에 기반한 판단 사이의 긴장을 이용한다.", "classicKo": "탐정소설과 고딕 공포를 절묘하게 결합해 홈스 장편 가운데 가장 널리 읽히는 작품이 되었다. 분위기 자체가 추리의 일부처럼 작동한다.", "thinkKo": "강한 공포를 느끼는 순간에도 사실과 해석을 분리해서 생각할 수 있는가?", "contextEn": "The novel tests Holmes's rational method against Gothic atmosphere and a family curse. He does not dismiss fear; he separates fear from evidence.", "themeEn": "Fear creates pressure to settle quickly on an explanation, and the story exploits the tension between supernatural interpretation and evidence.", "classicEn": "Its fusion of detective fiction and Gothic horror makes atmosphere itself feel like part of the puzzle.", "thinkEn": "Can we still separate facts from interpretation when fear is intense?", "backgroundKo": "잉글랜드 데번주의 황량한 다트무어와 오래된 가문의 전설이 배경이다. 과학적 추론을 믿는 근대와 초자연적 저주를 두려워하는 전통의 충돌이 작품의 긴장을 만든다.", "backgroundEn": "Set on the bleak moors of Dartmoor in Devon, England, around an old family legend. The landscape sharpens the conflict between modern evidence-based reasoning and supernatural fear."}, {"title": "The Scarlet Letter", "author": "Nathaniel Hawthorne", "year": 1850, "en": "On the breast of her gown, in fine red cloth, surrounded with an elaborate embroidery and fantastic flourishes of gold thread, appeared the letter A. It was so artistically done, and with so much fertility and gorgeous luxuriance of fancy, that it had all the effect of a last and fitting decoration to the apparel which she wore.", "ko": "그녀의 옷 가슴 부분에는 고운 붉은 천으로 만든 A자가 붙어 있었고, 주위에는 정교한 자수와 금실 장식이 화려하게 둘러져 있었다. 너무 예술적이고 풍부한 상상력으로 만들어져 있어서, 그녀가 입은 옷에 마지막으로 더해진 완벽한 장식처럼 보일 정도였다.", "contextKo": "헤스터 프린은 간통의 표시인 붉은 A자를 달고 공개적으로 수치를 당해야 한다. 그런데 그녀는 그 처벌의 표식을 아름답고 정교하게 만들어 공동체가 부여한 의미를 그대로 받아들이지 않는다.", "themeKo": "죄 자체만큼 중요한 것은 누가 죄를 정의하고 누가 처벌하는가이다. 공개적으로 낙인찍힌 헤스터와 죄를 숨긴 딤스데일의 대비는 수치와 위선의 서로 다른 효과를 보여준다.", "classicKo": "개인의 내면과 공동체의 도덕적 권력이 충돌하는 미국문학의 핵심 작품이다. 한 글자 A의 의미가 작품 전체에서 계속 변화한다는 상징 구조도 뛰어나다.", "thinkKo": "사회의 낙인은 사람의 정체성을 결정하는가, 아니면 당사자가 그 의미를 다시 만들 수 있는가?", "contextEn": "Hester must wear the scarlet A as public punishment, yet she transforms the imposed mark through extraordinary craftsmanship.", "themeEn": "The novel asks not only what sin is, but who has authority to define and punish it, contrasting public shame with concealed guilt.", "classicEn": "Its conflict between inward identity and communal moral power is central to American literature, while the meaning of A keeps changing.", "thinkEn": "Does a social stigma determine identity, or can the person marked by it remake its meaning?", "backgroundKo": "17세기 청교도 식민지 보스턴이 배경이다. 호손은 19세기 미국에서 이 시대를 되돌아보며 공동체의 엄격한 종교적 규범과 개인의 죄책감·자유가 충돌하는 모습을 그렸다.", "backgroundEn": "Set in seventeenth-century Puritan Boston. Writing in nineteenth-century America, Hawthorne revisited strict communal religious codes and their effects on guilt, identity and freedom."}, {"title": "The Count of Monte Cristo", "author": "Alexandre Dumas", "year": 1844, "en": "He decided it was human hatred, not divine vengeance, that had plunged him into this abyss. He devoted these unknown men to every torment his fiery imagination could devise, while still considering the most terrible ones too mild and, above all, too brief; for after torment came death, bringing, if not repose, at least the insensibility resembling it.", "ko": "그는 자신을 이 심연에 빠뜨린 것이 신의 복수가 아니라 인간의 증오라고 결론 내렸다. 그는 아직 알지 못하는 원수들에게 불타는 상상력이 만들어낼 수 있는 모든 고통을 내리겠다고 마음먹었다. 그러나 가장 끔찍한 고통조차 너무 가볍고 무엇보다 너무 짧다고 느꼈다. 고통 뒤에는 죽음이 오고, 죽음은 평안은 아니더라도 적어도 평안과 닮은 무감각을 가져오기 때문이다.", "contextKo": "억울하게 투옥된 에드몽 당테스가 자신의 불행이 우연이나 신의 뜻이 아니라 사람들의 음모 때문임을 깨닫는 과정이다. 이 인식은 훗날 치밀한 복수 계획의 씨앗이 된다.", "themeKo": "독자는 처음에는 당테스의 복수를 정의롭게 느끼기 쉽다. 그러나 복수가 진행될수록 죄를 지은 사람뿐 아니라 주변의 무고한 사람까지 피해를 입으며 '정의와 복수는 같은가'라는 질문이 커진다.", "classicKo": "통쾌한 모험과 복수극의 외형 안에 권력, 돈, 정체성, 용서의 문제를 넣었다. 그래서 긴 분량에도 강한 서사적 추진력을 유지한다.", "thinkKo": "피해자가 완벽한 힘을 얻게 되었을 때 어디까지가 정의이고 어디서부터 복수가 되는가?", "contextEn": "Wrongfully imprisoned Dantès realizes that human conspiracy, not divine fate, caused his ruin. That discovery plants the seed of his later revenge.", "themeEn": "Revenge initially feels like justice, but its widening damage forces a distinction between punishing guilt and becoming an agent of suffering.", "classicEn": "Beneath its exhilarating adventure lie questions of power, wealth, identity, justice and forgiveness.", "thinkEn": "If a victim gains overwhelming power, where does justice end and revenge begin?", "backgroundKo": "나폴레옹 몰락 전후의 프랑스와 지중해 세계가 배경이다. 정권 교체와 정치적 밀고가 개인의 운명을 바꾸던 시대를 이용해 뒤마는 투옥, 탈출, 부와 복수의 장대한 이야기를 펼쳤다.", "backgroundEn": "Set in France and the Mediterranean around the fall of Napoleon. Political upheaval and denunciations create the conditions for Dantès’s imprisonment and his sweeping quest for revenge."}, {"title": "Around the World in Eighty Days", "author": "Jules Verne", "year": 1872, "en": "Phileas Fogg was one of those mathematically exact people who, never hurried and always ready, are economical of their steps and movements. He never took one step too many, always going to his destination by the shortest cut; he made no superfluous gestures, and was never seen to be moved or agitated.", "ko": "필리어스 포그는 수학처럼 정확한 사람들 가운데 하나였다. 결코 서두르지 않으면서 언제나 준비되어 있었고, 걸음과 동작조차 낭비하지 않았다. 필요 이상의 한 걸음을 내딛는 법이 없었으며 언제나 가장 짧은 길로 목적지에 갔다. 쓸데없는 몸짓도 하지 않았고 감정적으로 동요하는 모습도 좀처럼 보이지 않았다.", "contextKo": "모험이 시작되기 전 포그의 극단적으로 규칙적인 성격을 보여주는 묘사다. 세계일주라는 예측 불가능한 여행은 바로 이런 사람을 혼돈 속에 던져 넣는 실험이 된다.", "themeKo": "시간표와 철도, 증기선이 세계를 연결하던 시대의 낙관이 작품에 가득하다. 동시에 계산만으로는 해결되지 않는 우연, 인간관계와 희생이 포그를 변화시킨다.", "classicKo": "근대 교통기술이 인간의 시간과 공간 감각을 어떻게 바꾸었는지를 모험으로 체감하게 하는 작품이다. 정확성과 예측불가능성의 충돌이 유머와 긴장을 만든다.", "thinkKo": "효율성과 정확성만으로 잘 설계된 삶이 좋은 삶이라고 할 수 있을까?", "contextEn": "Before the adventure begins, Fogg is presented as almost mechanically regular. The unpredictable journey becomes an experiment performed on such a man.", "themeEn": "The novel celebrates railways, steamships and timetables, yet chance, relationships and sacrifice repeatedly exceed calculation.", "classicEn": "It turns the nineteenth-century transformation of time and distance into an adventure, using precision versus unpredictability for tension and comedy.", "thinkEn": "Can a life optimized for efficiency and precision alone be called a good life?", "backgroundKo": "1870년대 증기선과 철도, 수에즈운하가 세계의 이동시간을 단축하던 시대가 배경이다. 베른은 당시의 교통망과 세계지도에 대한 대중의 열광을 정교한 시간표 모험으로 바꾸었다.", "backgroundEn": "Set in the 1870s, when steamships, railways and the Suez Canal were shrinking travel times. Verne transformed contemporary fascination with global transport into a timetable-driven adventure."}, {"title": "The Strange Case of Dr Jekyll and Mr Hyde", "author": "Robert Louis Stevenson", "year": 1886, "en": "With every day, and from both sides of my intelligence, the moral and the intellectual, I thus drew steadily nearer to that truth, by whose partial discovery I have been doomed to such a dreadful shipwreck: that man is not truly one, but truly two. I say two, because the state of my own knowledge does not pass beyond that point.", "ko": "날이 갈수록 도덕적 측면과 지적 측면 모두에서 나는 하나의 진실에 점점 가까워졌다. 그 진실을 일부나마 발견한 탓에 나는 결국 끔찍한 파멸을 맞게 되었다. 그것은 인간이 진정 하나의 존재가 아니라 둘이라는 사실이다. 내가 둘이라고 말하는 것은 나의 지식이 아직 그 이상까지는 이르지 못했기 때문이다.", "contextKo": "지킬 박사가 자신의 실험을 설명하면서 인간 안에 서로 충돌하는 욕망과 도덕적 자아가 공존한다고 주장하는 대목이다. 그는 둘을 분리하면 더 자유로워질 것이라고 생각한다.", "themeKo": "문제는 '악한 또 다른 자아'가 존재한다는 것만이 아니다. 지킬이 하이드라는 별도의 인격을 만들어 자신의 행동에 대한 책임까지 분리하려 했다는 점이 핵심이다.", "classicKo": "지킬과 하이드는 이제 이중인격의 문화적 상징이 되었지만, 원작은 자기통제와 책임 회피에 관한 훨씬 미묘한 이야기다.", "thinkKo": "자신의 욕망을 '진짜 내가 아니다'라고 분리해서 생각하는 순간 책임감도 함께 약해지는 것은 아닐까?", "contextEn": "Jekyll argues that conflicting moral selves coexist within a person and imagines that separating them could create freedom.", "themeEn": "The deeper problem is not merely an evil second self, but Jekyll's attempt to separate conduct from responsibility.", "classicEn": "Jekyll and Hyde became a cultural symbol of duality, yet the original is a subtler study of self-control and evasion of responsibility.", "thinkEn": "When we label an impulse as 'not the real me,' do we also weaken our responsibility for it?", "backgroundKo": "빅토리아 시대 런던의 체면과 도덕 규범, 숨겨진 욕망이 배경이다. 스티븐슨은 인간 심리와 과학 실험에 대한 관심을 결합해 존경받는 시민의 공적 얼굴과 사적 충동을 대비했다.", "backgroundEn": "Set in Victorian London, where respectability and strict moral codes coexisted with concealed desires. Stevenson combined interest in psychology and scientific experiment to explore divided public and private selves."}, {"title": "The Secret Garden", "author": "Frances Hodgson Burnett", "year": 1911, "en": "She was standing inside the secret garden. It was the sweetest, most mysterious-looking place any one could imagine. The high walls which shut it in were covered with the leafless stems of climbing roses which were so thick that they were matted together. Mary Lennox knew they were roses because she had seen a great many roses in India.", "ko": "메리는 비밀의 정원 안에 서 있었다. 누구라도 상상할 수 있는 가장 아름답고 신비로운 장소였다. 정원을 둘러싼 높은 벽에는 잎이 떨어진 덩굴장미 줄기가 빽빽하게 얽혀 있었다. 메리 레녹스는 인도에서 장미를 많이 보았기 때문에 그것이 장미라는 것을 알아보았다.", "contextKo": "오랫동안 잠겨 있던 정원에 메리가 처음 들어가는 순간이다. 처음에는 죽은 것처럼 보이는 정원이지만 자세히 살펴보면 살아 있는 싹이 숨어 있다. 정원의 회복은 아이들의 변화와 나란히 진행된다.", "themeKo": "자연은 단순한 배경이 아니라 치유의 주체다. 외롭고 자기중심적이던 아이들이 흙을 만지고 함께 일하면서 몸과 관계가 동시에 회복된다.", "classicKo": "기적을 초자연적 사건으로만 그리지 않고 햇빛, 운동, 관심, 우정과 목적의식 같은 일상의 힘으로 보여준다는 점에서 지금도 읽을 가치가 있다.", "thinkKo": "사람을 변화시키는 데 충고보다 환경과 작은 일상의 습관이 더 강력할 때가 있지 않은가?", "contextEn": "Mary enters the long-locked garden. Though it appears dead, signs of life remain; the garden's restoration parallels the children's own recovery.", "themeEn": "Nature is an active agent of healing as lonely children change through work, movement, friendship and shared purpose.", "classicEn": "Its 'magic' often consists of ordinary forces—sunlight, exercise, attention, companionship and purpose.", "thinkEn": "Can environment and daily habits sometimes change a person more effectively than advice?", "backgroundKo": "20세기 초 영국 요크셔의 대저택과 정원이 무대다. 인도에서 자란 영국인 소녀가 영국으로 돌아오는 설정에는 제국시대의 생활상이 담겨 있으며, 신선한 공기와 자연의 치유력에 대한 당시 관심도 반영된다.", "backgroundEn": "Set at an English manor in Yorkshire in the early twentieth century. Mary’s arrival from colonial India reflects the imperial setting, while the story draws on contemporary faith in fresh air, nature and recovery."}, {"title": "Anne of Green Gables", "author": "L. M. Montgomery", "year": 1908, "en": "Isn't it splendid to think of all the things there are to find out about? It just makes me feel glad to be alive—it's such an interesting world. It wouldn't be half so interesting if we knew all about everything, would it? There'd be no scope for imagination then, would there?", "ko": "우리가 앞으로 알아낼 것이 이렇게 많다는 생각은 정말 멋지지 않나요? 세상이 너무 흥미로워서 살아 있다는 사실 자체가 기뻐져요. 우리가 모든 것을 이미 다 알고 있다면 세상이 절반도 이렇게 재미있지 않을 거예요. 그러면 상상력을 펼칠 여지도 없잖아요?", "contextKo": "앤의 가장 중요한 특징인 상상력과 호기심이 잘 드러나는 말이다. 고아로서 안정된 삶을 거의 경험하지 못했지만, 앤은 부족함을 상상력으로 세계를 확장하는 힘으로 바꾼다.", "themeKo": "성장은 상상력을 버리고 현실적이 되는 과정으로만 그려지지 않는다. 앤은 실수를 통해 성숙하지만 세계를 흥미롭게 바라보는 능력은 잃지 않는다.", "classicKo": "일상의 작은 장소와 관계를 특별하게 바라보는 앤의 시선 때문에 한 세기가 넘도록 사랑받았다. 독자는 사건보다 '어떻게 바라보느냐'가 삶의 질을 바꿀 수 있음을 경험한다.", "thinkKo": "성숙한다는 것은 상상력을 줄이는 것일까, 아니면 상상력을 현실과 더 잘 연결하는 법을 배우는 것일까?", "contextEn": "Anne's curiosity and imagination transform deprivation into a way of enlarging the world rather than shrinking from it.", "themeEn": "Growing up does not mean abandoning imagination. Anne matures through mistakes while retaining her capacity for wonder.", "classicEn": "Her way of seeing makes ordinary places and relationships vivid, suggesting that attention itself can change the quality of life.", "thinkEn": "Does maturity require less imagination, or learning to connect imagination more wisely to reality?", "backgroundKo": "19세기 말 캐나다 프린스에드워드아일랜드의 농촌 공동체가 배경이다. 몽고메리는 자신이 익숙하게 알던 섬의 풍경과 학교·교회·이웃 관계를 바탕으로 고아 소녀의 성장 이야기를 만들었다.", "backgroundEn": "Set in a late-nineteenth-century rural community on Prince Edward Island, Canada. Montgomery drew on familiar island landscapes, schools, churches and neighbors to shape Anne’s coming-of-age story."}, {"title": "The Wonderful Wizard of Oz", "author": "L. Frank Baum", "year": 1900, "en": "There were several roads nearby, but it did not take her long to find the one paved with yellow bricks. Within a short time she was walking briskly toward the Emerald City, her silver shoes tinkling merrily on the hard, yellow road-bed. The sun shone bright and the birds sang sweetly and Dorothy did not feel nearly so bad as you might think a little girl would who had been suddenly whisked away from her own country.", "ko": "근처에는 여러 길이 있었지만 노란 벽돌로 포장된 길을 찾는 데 오래 걸리지 않았다. 얼마 지나지 않아 도로시는 단단한 노란 길 위에서 은구두를 경쾌하게 울리며 에메랄드 시를 향해 씩씩하게 걷고 있었다. 햇빛은 밝았고 새들은 아름답게 노래했다. 갑자기 고향에서 멀리 날아온 어린아이라고 생각하기 어려울 만큼 도로시는 그리 낙담하지 않았다.", "contextKo": "도로시가 오즈의 마법사를 찾아 본격적인 여행을 시작하는 장면이다. 이후 만나는 허수아비, 양철 나무꾼, 겁쟁이 사자는 각각 자신에게 부족하다고 믿는 것을 얻기 위해 동행한다.", "themeKo": "흥미로운 점은 동료들이 원하는 지혜, 마음, 용기를 이미 행동으로 보여주고 있다는 것이다. 외부의 권위자가 그것을 '부여'해야만 자신에게 있다고 믿는 것이 문제다.", "classicKo": "미국적 판타지의 대표작이면서 자기인식에 관한 우화로 읽을 수 있다. 여행의 목적지는 멀리 있지만 필요한 능력은 여행 과정에서 이미 드러난다.", "thinkKo": "우리는 이미 가진 능력을 누군가가 인정해 주어야만 비로소 자신의 것으로 믿는 경우가 얼마나 많은가?", "contextEn": "Dorothy begins the road to the Wizard, soon joined by companions who believe they lack intelligence, heart and courage.", "themeEn": "The irony is that each companion repeatedly demonstrates the very quality he thinks must be granted by an external authority.", "classicEn": "The American fantasy can also be read as a fable of self-recognition: the journey reveals capacities already present.", "thinkEn": "How often do we wait for someone else's validation before believing in abilities we already possess?", "backgroundKo": "20세기 초 미국 중서부의 농장과 환상적인 오즈의 나라를 오간다. 바움은 유럽의 오래된 잔혹한 동화 관습과 다른, 미국 어린이를 위한 현대적인 환상동화를 쓰고자 했다.", "backgroundEn": "Moving between the American Midwest and the fantastic Land of Oz, Baum sought to create a modern American fairy tale for children, distinct from some harsher conventions of older European tales."}];let qs=[],i=0,score=0,answered=false;const $=x=>document.getElementById(x);function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
let audioCtx;
function chime(){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const now=audioCtx.currentTime;
  [659.25,783.99,1046.5].forEach((freq,n)=>{
   const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
   osc.type="sine";osc.frequency.value=freq;
   const t=now+n*.13;
   gain.gain.setValueAtTime(.0001,t);
   gain.gain.exponentialRampToValueAtTime(.12,t+.018);
   gain.gain.exponentialRampToValueAtTime(.0001,t+.52);
   osc.connect(gain).connect(audioCtx.destination);
   osc.start(t);osc.stop(t+.54);
  });
 }catch(e){}
}
function start(){chime();qs=shuffle(books).slice(0,3);i=0;score=0;["start","finish","stopped"].forEach(x=>$(x).classList.add("hidden"));$("game").classList.remove("hidden");show()}
function show(){window.scrollTo(0,0);answered=false;const q=qs[i],ko=$("lang").value==="ko";$("progress").textContent=`${i+1} / 3`;$("score").textContent=`${ko?"점수":"Score"} ${score}`;$("question").textContent=ko?"이 글은 어느 작품일까요?":"Which classic is this passage from?";$("passage").textContent=q[ko?"ko":"en"];$("result").innerHTML="";$("about").classList.add("hidden");$("hint").classList.add("hidden");$("nextBtn").classList.add("hidden");$("choices").innerHTML="";let opts=shuffle([q,...shuffle(books.filter(b=>b.title!==q.title)).slice(0,3)]);opts.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o.title;b.onclick=()=>answer(o,q,b);$("choices").appendChild(b)})}
function answer(a,q,b){if(answered)return;answered=true;const ko=$("lang").value==="ko";[...$("choices").children].forEach(x=>x.disabled=true);if(a.title===q.title){score++;b.style.background="#dcefe4";$("result").innerHTML=`<div class="feedback ok">${ko?"정답!":"Correct!"}</div>`}else{b.style.background="#f4dddd";[...$("choices").children].find(x=>x.textContent===q.title).style.background="#dcefe4";$("result").innerHTML=`<div class="feedback bad">${ko?"아쉽습니다!":"Not quite!"}</div>`}$("result").innerHTML+=`<div class="bookline">${q.title} — ${q.author} (${q.year})</div>`;$("score").textContent=`${ko?"점수":"Score"} ${score}`;$("nextBtn").textContent=i===2?(ko?"결과 보기 · Results":"See Results"):(ko?"다음 문제 · Next":"Next Question");$("nextBtn").classList.remove("hidden");$("hint").textContent=ko?"↓ 더 읽고 싶으면 아래의 작품 이야기를 보세요.":"↓ Scroll down for the story behind the book.";$("hint").classList.remove("hidden");const keys=ko?["backgroundKo","contextKo","themeKo","classicKo","thinkKo"]:["backgroundEn","contextEn","themeEn","classicEn","thinkEn"];const heads=ko?["작품의 배경","이 장면의 맥락","작품의 핵심","왜 고전인가","생각해 볼 질문"]:["Background","Context","Core Idea","Why It Endures","A Question to Consider"];$("about").innerHTML=`<h3>${ko?"작품 이야기 · About the Book":"About the Book"}</h3>`+keys.map((k,n)=>`<h4>${heads[n]}</h4><p class="${n===4?"think":""}">${q[k]}</p>`).join("");$("about").classList.remove("hidden")}
function finish(){$("game").classList.add("hidden");$("finish").classList.remove("hidden");const ko=$("lang").value==="ko";$("final").innerHTML=`<b>${score} / 3</b><br>${ko?"오늘 세 작품을 만났습니다.":"Three classics encountered today."}`;$("today").innerHTML=`<div class="seedlabel">${ko?"오늘 만난 작품 · 씨앗 지식":"Today's Books · Seed Knowledge"}</div>`+qs.map((q,n)=>`<div class="seedcard"><div class="seedtitle">${n+1}. ${q.title}</div><div class="seedmeta">${q.author} · ${q.year}</div><p class="seedtext">${q[ko?"themeKo":"themeEn"]}</p></div>`).join("");window.scrollTo(0,0)}
$("startBtn").onclick=start;$("againBtn").onclick=start;$("restartBtn").onclick=start;$("nextBtn").onclick=()=>{i++;i<3?show():finish()};$("stopBtn").onclick=()=>{$("game").classList.add("hidden");$("stoppedScore").textContent=`${score} / ${i+1}`;$("stopped").classList.remove("hidden");window.scrollTo(0,0)};
</script></body></html>
